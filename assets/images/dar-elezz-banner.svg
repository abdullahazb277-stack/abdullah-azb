    <text x="65" y="17" fill="#00D1B2" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">DAR ELEZZ MAM</text>
    <text x="0" y="55" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Industrial Support Systems &amp; Fasteners</text>
