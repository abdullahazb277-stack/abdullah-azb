    <text x="16" y="143" fill="#00D1B2" font-family="system-ui" font-size="13" font-weight="700">Clevis &amp; Sprinkler Hangers</text>
    <!-- Clevis loop icon -->
    <path d="M 25 165 C 25 195, 55 195, 55 165 L 48 165 C 48 188, 32 188, 32 165 Z" fill="#00D1B2"/>
    <circle cx="40" cy="155" r="3" fill="#4DA3FF"/>
