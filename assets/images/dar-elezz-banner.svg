    <rect width="230" height="100" rx="8" fill="#111821" stroke="#283443" stroke-width="1.5"/>
    <text x="16" y="28" fill="#4DA3FF" font-family="system-ui" font-size="13" font-weight="700">Strut Channels &amp; Beam Clamps</text>
    <!-- Strut cross section icon -->
    <path d="M 20 50 L 50 50 L 50 80 L 20 80 L 20 72 L 40 72 L 40 58 L 20 58 Z" fill="#283443" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="65" y="60" fill="#F5F7FA" font-family="system-ui" font-size="11">Slotted / Solid C-Channel</text>
    <text x="65" y="76" fill="#A7B0BE" font-family="monospace" font-size="10">Heavy-Duty Steel Profiles</text>

    <!-- Item 2: Clevis & Sprinkler Hangers -->
