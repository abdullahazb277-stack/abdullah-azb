    <text x="110" y="105" fill="#F5F7FA" font-family="system-ui" font-size="12">Rubber Lined Hangers</text>
    <text x="110" y="122" fill="#A7B0BE" font-family="monospace" font-size="10">Acoustic &amp; Vibration Damp</text>
    <text x="110" y="145" fill="#F5F7FA" font-family="system-ui" font-size="12">Bolts, Nuts &amp; Washers</text>
    <text x="110" y="162" fill="#A7B0BE" font-family="monospace" font-size="10">Grade 8.8 / Stainless Steel</text>
