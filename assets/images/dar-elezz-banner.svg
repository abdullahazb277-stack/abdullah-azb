  </defs>

  <rect width="900" height="450" rx="16" fill="url(#darBg)" stroke="#283443" stroke-width="2"/>

  <!-- Technical Background Grid -->
  <g stroke="#1C2736" stroke-width="1" stroke-dasharray="6,6">
    <line x1="50" y1="80" x2="850" y2="80"/>
    <line x1="50" y1="220" x2="850" y2="220"/>
    <line x1="50" y1="360" x2="850" y2="360"/>
    <line x1="450" y1="40" x2="450" y2="410"/>
