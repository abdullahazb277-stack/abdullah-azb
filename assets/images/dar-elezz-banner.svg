<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="darBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1723"/>
      <stop offset="100%" stop-color="#162233"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="50%" stop-color="#00D1B2"/>
      <stop offset="100%" stop-color="#4DA3FF"/>
