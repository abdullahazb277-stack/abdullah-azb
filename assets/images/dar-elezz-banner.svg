      <text x="12" y="28" fill="#A7B0BE" font-family="monospace" font-size="10">Arabic &amp; English MEP Catalogs</text>
      
      <text x="0" y="52" fill="#F5F7FA" font-family="system-ui" font-size="12" font-weight="600">• Contractor Audience</text>
      <text x="12" y="68" fill="#A7B0BE" font-family="monospace" font-size="10">Engineers, MEP Consultancies</text>

      <text x="0" y="92" fill="#F5F7FA" font-family="system-ui" font-size="12" font-weight="600">• Technical SEO &amp; Profile</text>
      <text x="12" y="108" fill="#A7B0BE" font-family="monospace" font-size="10">Search Optimization &amp; LinkedIn</text>

      <text x="0" y="132" fill="#4DA3FF" font-family="system-ui" font-size="11" font-weight="600">Official Portal:</text>
      <text x="0" y="148" fill="#00D1B2" font-family="monospace" font-size="11">darelezz-mam.com</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="60" y="420" fill="#7D8590" font-family="monospace" font-size="11">BUSINESS &amp; INDUSTRIAL COLLABORATION — DAR ELEZZ MAM</text>
</svg>
