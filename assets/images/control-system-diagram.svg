<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1622"/>
      <stop offset="100%" stop-color="#141E2B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00D1B2"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4DA3FF"/>
    </marker>
  </defs>

  <rect width="880" height="340" rx="14" fill="url(#csBg)" stroke="#283443" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="40" y="36" fill="#00D1B2" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CLASSICAL CONTROL SYSTEMS ARCHITECTURE</text>
  <text x="40" y="60" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Closed-Loop Feedback Control &amp; PID Transfer Function Loop</text>

  <!-- Reference Input R(s) -->
  <text x="40" y="142" fill="#A7B0BE" font-family="monospace" font-size="13">Setpoint</text>
  <text x="40" y="162" fill="#00D1B2" font-family="serif" font-size="16" font-style="italic" font-weight="700">R(s)</text>
  <line x1="85" y1="150" x2="148" y2="150" stroke="#00D1B2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="142" fill="#00D1B2" font-family="monospace" font-size="13" font-weight="bold">+</text>

  <!-- Summing Junction -->
  <circle cx="160" cy="150" r="14" fill="#151E29" stroke="#00D1B2" stroke-width="2"/>
  <line x1="150" y1="140" x2="170" y2="160" stroke="#00D1B2" stroke-width="1.5"/>
  <line x1="150" y1="160" x2="170" y2="140" stroke="#00D1B2" stroke-width="1.5"/>
  <text x="146" y="180" fill="#FF7B72" font-family="monospace" font-size="14" font-weight="bold">-</text>

  <!-- Error Signal E(s) -->
  <line x1="174" y1="150" x2="235" y2="150" stroke="#00D1B2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="142" fill="#F5F7FA" font-family="serif" font-size="14" font-style="italic">E(s)</text>

  <!-- Block 1: PID Controller Gc(s) -->
  <g transform="translate(240, 110)">
    <rect width="160" height="80" rx="8" fill="#151E29" stroke="#00D1B2" stroke-width="1.5"/>
    <text x="80" y="30" fill="#00D1B2" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">PID CONTROLLER</text>
    <text x="80" y="52" fill="#F5F7FA" font-family="serif" font-size="13" font-style="italic" text-anchor="middle">Gc(s) = Kp + Ki/s + Kd·s</text>
    <text x="80" y="68" fill="#A7B0BE" font-family="monospace" font-size="9" text-anchor="middle">Proportional-Integral-Derivative</text>
  </g>

  <!-- Controller Output U(s) -->
  <line x1="400" y1="150" x2="455" y2="150" stroke="#00D1B2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="142" fill="#F5F7FA" font-family="serif" font-size="14" font-style="italic">U(s)</text>

  <!-- Block 2: Actuator / Driver -->
  <g transform="translate(460, 110)">
    <rect width="130" height="80" rx="8" fill="#151E29" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="65" y="32" fill="#4DA3FF" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">ACTUATOR</text>
    <text x="65" y="52" fill="#F5F7FA" font-family="system-ui" font-size="11" text-anchor="middle">Motor / Driver</text>
    <text x="65" y="68" fill="#A7B0BE" font-family="monospace" font-size="9" text-anchor="middle">H-Bridge / Valve</text>
  </g>

  <!-- Drive Signal -->
  <line x1="590" y1="150" x2="635" y2="150" stroke="#4DA3FF" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Block 3: Process / Plant Gp(s) -->
  <g transform="translate(640, 110)">
    <rect width="140" height="80" rx="8" fill="#151E29" stroke="#00D1B2" stroke-width="1.5"/>
    <text x="70" y="32" fill="#00D1B2" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">PLANT / PROCESS</text>
    <text x="70" y="52" fill="#F5F7FA" font-family="serif" font-size="14" font-style="italic" text-anchor="middle">Gp(s)</text>
    <text x="70" y="68" fill="#A7B0BE" font-family="monospace" font-size="9" text-anchor="middle">Physical Dynamics</text>
  </g>

  <!-- Output Signal Y(s) -->
  <line x1="780" y1="150" x2="845" y2="150" stroke="#00D1B2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="142" fill="#F5F7FA" font-family="serif" font-size="15" font-style="italic" font-weight="bold">Y(s)</text>
  <text x="800" y="172" fill="#A7B0BE" font-family="monospace" font-size="10">Output</text>

  <!-- Feedback Loop -->
  <circle cx="810" cy="150" r="3.5" fill="#00D1B2"/>
  <line x1="810" y1="150" x2="810" y2="260" stroke="#4DA3FF" stroke-width="2"/>
  <line x1="810" y1="260" x2="605" y2="260" stroke="#4DA3FF" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Feedback Sensor Block H(s) -->
  <g transform="translate(425, 230)">
    <rect width="175" height="60" rx="8" fill="#151E29" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="87" y="26" fill="#4DA3FF" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">SENSOR FEEDBACK H(s)</text>
    <text x="87" y="44" fill="#A7B0BE" font-family="monospace" font-size="10" text-anchor="middle">Encoder / IMU / Transducer</text>
  </g>

  <!-- Return Path from H(s) to Summing Junction -->
  <line x1="425" y1="260" x2="160" y2="260" stroke="#4DA3FF" stroke-width="2"/>
  <line x1="160" y1="260" x2="160" y2="170" stroke="#4DA3FF" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="170" y="225" fill="#A7B0BE" font-family="serif" font-size="12" font-style="italic">B(s)</text>

  <!-- Caption -->
  <text x="40" y="320" fill="#7D8590" font-family="monospace" font-size="10">TRANSFER FUNCTION: T(s) = Y(s) / R(s) = [Gc(s)·Gp(s)] / [1 + Gc(s)·Gp(s)·H(s)]</text>
</svg>
