<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1724"/>
      <stop offset="100%" stop-color="#151E29"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D1B2"/>
      <stop offset="100%" stop-color="#4DA3FF"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#1D6FD8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00D1B2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)" stroke="#283443" stroke-width="2"/>
  
  <!-- Grid Lines -->
  <g stroke="#1F2A38" stroke-width="1" stroke-dasharray="4,4">
    <line x1="50" y1="60" x2="750" y2="60"/>
    <line x1="50" y1="240" x2="750" y2="240"/>
    <line x1="50" y1="420" x2="750" y2="420"/>
    <line x1="400" y1="40" x2="400" y2="440"/>
  </g>

  <!-- Header Title -->
  <text x="50" y="42" fill="#00D1B2" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SYSTEM ARCHITECTURE — ASSISTIVE MECHATRONICS</text>
  <text x="50" y="70" fill="#F5F7FA" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Smart Tilt-Controlled Wheelchair Concept</text>
  <text x="50" y="92" fill="#A7B0BE" font-family="system-ui, -apple-system, sans-serif" font-size="13">Head-Orientation Tracking via IMU to Dual DC Motor Drive with Safety Neutral Zone</text>

  <!-- Block 1: Wearable Head Unit -->
  <g transform="translate(60, 120)">
    <rect width="280" height="300" rx="12" fill="#111821" stroke="#283443" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="34" rx="12" fill="#1A2433"/>
    <rect x="0" y="24" width="280" height="10" fill="#1A2433"/>
    <circle cx="20" cy="17" r="4" fill="#00D1B2"/>
    <text x="32" y="22" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">WEARABLE HEAD-MOUNTED UNIT</text>

    <!-- MPU6050 Module -->
    <rect x="25" y="55" width="230" height="60" rx="8" fill="#151E29" stroke="#00D1B2" stroke-width="1"/>
    <text x="40" y="80" fill="#00D1B2" font-family="system-ui, sans-serif" font-size="13" font-weight="600">MPU6050 6-DoF IMU Sensor</text>
    <text x="40" y="100" fill="#A7B0BE" font-family="monospace" font-size="11">Pitch &amp; Roll Sensing (3-Axis Gyro + Accel)</text>

    <!-- Filter / Processing Module -->
    <rect x="25" y="130" width="230" height="60" rx="8" fill="#151E29" stroke="#283443" stroke-width="1"/>
    <text x="40" y="155" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Complementary Filtering</text>
    <text x="40" y="175" fill="#A7B0BE" font-family="monospace" font-size="11">Noise Filtering &amp; Drift Compensation</text>

    <!-- ESP32 Transmitter -->
    <rect x="25" y="205" width="230" height="70" rx="8" fill="#151E29" stroke="#4DA3FF" stroke-width="1"/>
    <text x="40" y="230" fill="#4DA3FF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ESP32 Controller (Transmitter)</text>
    <text x="40" y="250" fill="#A7B0BE" font-family="monospace" font-size="11">Neutral Deadzone &amp; Threshold Detection</text>
    <text x="40" y="266" fill="#00D1B2" font-family="monospace" font-size="10">Built-in Bluetooth Transceiver (2.4 GHz)</text>

    <!-- Internal Connector lines -->
    <line x1="140" y1="115" x2="140" y2="130" stroke="#00D1B2" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="140" y1="190" x2="140" y2="205" stroke="#4DA3FF" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Wireless Link in Middle -->
  <g transform="translate(340, 245)">
    <line x1="10" y1="20" x2="100" y2="20" stroke="url(#tealGrad)" stroke-width="2.5" stroke-dasharray="5,4"/>
    <polygon points="104,20 94,15 94,25" fill="#4DA3FF"/>
    <polygon points="6,20 16,15 16,25" fill="#00D1B2"/>
    <rect x="18" y="2" width="75" height="18" rx="4" fill="#0B0F14" stroke="#283443"/>
    <text x="55" y="15" fill="#00D1B2" font-family="monospace" font-size="9" text-anchor="middle" font-weight="600">BLUETOOTH RF</text>
    <text x="55" y="48" fill="#A7B0BE" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Bidirectional Ping</text>
  </g>

  <!-- Block 2: Base Wheelchair Controller Unit -->
  <g transform="translate(450, 120)">
    <rect width="290" height="300" rx="12" fill="#111821" stroke="#283443" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="34" rx="12" fill="#1A2433"/>
    <rect x="0" y="24" width="290" height="10" fill="#1A2433"/>
    <circle cx="20" cy="17" r="4" fill="#4DA3FF"/>
    <text x="32" y="22" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">WHEELCHAIR BASE &amp; DRIVE UNIT</text>

    <!-- ESP32 Receiver & Logic -->
    <rect x="25" y="50" width="240" height="64" rx="8" fill="#151E29" stroke="#4DA3FF" stroke-width="1"/>
    <text x="40" y="73" fill="#4DA3FF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ESP32 Receiver &amp; Logic</text>
    <text x="40" y="91" fill="#A7B0BE" font-family="monospace" font-size="11">Direction Decoupling &amp; Speed Mapping</text>
    <text x="40" y="105" fill="#FF7B72" font-family="monospace" font-size="10">Fail-Safe Timeout: Auto-Brake on Loss</text>

    <!-- IBT-2 Motor Drivers -->
    <rect x="25" y="130" width="240" height="60" rx="8" fill="#151E29" stroke="#283443" stroke-width="1"/>
    <text x="40" y="153" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Dual IBT-2 H-Bridge Drivers</text>
    <text x="40" y="172" fill="#A7B0BE" font-family="monospace" font-size="11">High-Current PWM Speed Control (43A Max)</text>

    <!-- 24V DC Motors -->
    <rect x="25" y="210" width="112" height="65" rx="8" fill="#151E29" stroke="#00D1B2" stroke-width="1"/>
    <text x="35" y="233" fill="#00D1B2" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Left 24V Motor</text>
    <text x="35" y="250" fill="#A7B0BE" font-family="monospace" font-size="10">Differential Steer</text>
    <text x="35" y="264" fill="#A7B0BE" font-family="monospace" font-size="10">Gearbox Drive</text>

    <rect x="153" y="210" width="112" height="65" rx="8" fill="#151E29" stroke="#00D1B2" stroke-width="1"/>
    <text x="163" y="233" fill="#00D1B2" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Right 24V Motor</text>
    <text x="163" y="250" fill="#A7B0BE" font-family="monospace" font-size="10">Differential Steer</text>
    <text x="163" y="264" fill="#A7B0BE" font-family="monospace" font-size="10">Gearbox Drive</text>

    <!-- Internal Connector lines -->
    <line x1="145" y1="114" x2="145" y2="130" stroke="#4DA3FF" stroke-width="1.5"/>
    <line x1="81" y1="190" x2="81" y2="210" stroke="#00D1B2" stroke-width="1.5"/>
    <line x1="209" y1="190" x2="209" y2="210" stroke="#00D1B2" stroke-width="1.5"/>
  </g>

  <!-- Footer Tag -->
  <text x="50" y="450" fill="#7D8590" font-family="monospace" font-size="11">EXPLORATORY ACADEMIC MECHATRONICS CONCEPT — ABDULLAH AZB 2026</text>
</svg>
