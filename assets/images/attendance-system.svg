<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="rfidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1620"/>
      <stop offset="100%" stop-color="#141E28"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#rfidBg)" stroke="#283443" stroke-width="2"/>

  <!-- Header -->
  <text x="50" y="42" fill="#00D1B2" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">EMBEDDED IDENTIFICATION &amp; LOGGING</text>
  <text x="50" y="70" fill="#F5F7FA" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Smart Attendance Management System</text>
  <text x="50" y="92" fill="#A7B0BE" font-family="system-ui, -apple-system, sans-serif" font-size="13">RFID User Authentication, I2C Real-Time Clock Timestamping, and LCD State Display</text>

  <!-- Central Microcontroller & Peripherals Diagram -->
  <g transform="translate(50, 130)">
    <!-- Arduino Central Hub -->
    <rect x="240" y="70" width="220" height="180" rx="12" fill="#151E29" stroke="#00D1B2" stroke-width="2"/>
    <rect x="240" y="70" width="220" height="32" rx="12" fill="#1C2938"/>
    <rect x="240" y="92" width="220" height="10" fill="#1C2938"/>
    <text x="350" y="92" fill="#00D1B2" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">ARDUINO CORE MCU</text>
    <text x="350" y="130" fill="#F5F7FA" font-family="system-ui" font-size="12" text-anchor="middle">UID Verification Logic</text>
    <text x="350" y="152" fill="#A7B0BE" font-family="monospace" font-size="11" text-anchor="middle">Timestamp Logging</text>
    <text x="350" y="174" fill="#A7B0BE" font-family="monospace" font-size="11" text-anchor="middle">LCD &amp; Bluetooth Dispatch</text>
    <text x="350" y="215" fill="#4DA3FF" font-family="monospace" font-size="10" text-anchor="middle">[ SPI / I2C / UART Bus ]</text>

    <!-- Node 1: RFID RC522 Reader (Left Top) -->
    <rect x="0" y="20" width="170" height="90" rx="8" fill="#111821" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="15" y="45" fill="#4DA3FF" font-family="system-ui" font-size="12" font-weight="700">RC522 RFID Reader</text>
    <text x="15" y="65" fill="#A7B0BE" font-family="monospace" font-size="10">• 13.56 MHz Radio Link</text>
    <text x="15" y="82" fill="#A7B0BE" font-family="monospace" font-size="10">• SPI Communication</text>
    <text x="15" y="98" fill="#00D1B2" font-family="monospace" font-size="10">• Contactless UID Tag</text>

    <!-- Node 2: DS3231 RTC (Left Bottom) -->
    <rect x="0" y="180" width="170" height="90" rx="8" fill="#111821" stroke="#00D1B2" stroke-width="1.5"/>
    <text x="15" y="205" fill="#00D1B2" font-family="system-ui" font-size="12" font-weight="700">DS3231 High-Precision RTC</text>
    <text x="15" y="225" fill="#A7B0BE" font-family="monospace" font-size="10">• Battery-Backed Clock</text>
    <text x="15" y="242" fill="#A7B0BE" font-family="monospace" font-size="10">• Exact Date/Time Stamp</text>
    <text x="15" y="258" fill="#A7B0BE" font-family="monospace" font-size="10">• I2C Protocol (SDA/SCL)</text>

    <!-- Node 3: 16x2 LCD Display (Right Top) -->
    <rect x="530" y="20" width="170" height="90" rx="8" fill="#111821" stroke="#00D1B2" stroke-width="1.5"/>
    <text x="545" y="45" fill="#00D1B2" font-family="system-ui" font-size="12" font-weight="700">16x2 LCD + I2C</text>
    <text x="545" y="65" fill="#A7B0BE" font-family="monospace" font-size="10">• Immediate Visual Feedback</text>
    <text x="545" y="82" fill="#A7B0BE" font-family="monospace" font-size="10">• "Access Granted / ID"</text>
    <text x="545" y="98" fill="#A7B0BE" font-family="monospace" font-size="10">• Timestamp Display</text>

    <!-- Node 4: HC-05 Bluetooth (Right Bottom) -->
    <rect x="530" y="180" width="170" height="90" rx="8" fill="#111821" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="545" y="205" fill="#4DA3FF" font-family="system-ui" font-size="12" font-weight="700">HC-05 Bluetooth Module</text>
    <text x="545" y="225" fill="#A7B0BE" font-family="monospace" font-size="10">• UART Serial Link</text>
    <text x="545" y="242" fill="#A7B0BE" font-family="monospace" font-size="10">• Wireless Log Sync</text>
    <text x="545" y="258" fill="#A7B0BE" font-family="monospace" font-size="10">• PC / Mobile Terminal Data</text>

    <!-- Connecting Lines -->
    <line x1="170" y1="65" x2="240" y2="120" stroke="#4DA3FF" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="170" y1="225" x2="240" y2="180" stroke="#00D1B2" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="460" y1="120" x2="530" y2="65" stroke="#00D1B2" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="460" y1="180" x2="530" y2="225" stroke="#4DA3FF" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Footer Tag -->
  <text x="50" y="450" fill="#7D8590" font-family="monospace" font-size="11">ACADEMIC EMBEDDED IDENTIFICATION PROJECT CONCEPT — ABDULLAH AZB 2026</text>
</svg>
