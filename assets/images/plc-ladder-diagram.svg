<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" height="100%">
  <defs>
    <linearGradient id="plcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1622"/>
      <stop offset="100%" stop-color="#141E2B"/>
    </linearGradient>
  </defs>

  <rect width="880" height="360" rx="14" fill="url(#plcBg)" stroke="#283443" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="40" y="34" fill="#00D1B2" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SIEMENS TIA PORTAL / S7-1200 LADDER LOGIC (LAD)</text>
  <text x="40" y="58" fill="#F5F7FA" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Network 1: Three-Phase Motor Start/Stop Seal-In (Latch) Circuit</text>

  <!-- Left Power Rail (L1 / 24VDC +) -->
  <line x1="80" y1="80" x2="80" y2="310" stroke="#00D1B2" stroke-width="4"/>
  <text x="65" y="75" fill="#00D1B2" font-family="monospace" font-size="12" font-weight="bold">L+</text>

  <!-- Right Power Rail (M / 0VDC) -->
  <line x1="800" y1="80" x2="800" y2="310" stroke="#4DA3FF" stroke-width="4"/>
  <text x="795" y="75" fill="#4DA3FF" font-family="monospace" font-size="12" font-weight="bold">M</text>

  <!-- Main Rung Line -->
  <!-- Wire from Rail to Start Contact -->
  <line x1="80" y1="150" x2="160" y2="150" stroke="#00D1B2" stroke-width="2"/>

  <!-- Contact 1: Start Pushbutton (Normally Open - | | -) -->
  <g transform="translate(160, 150)">
    <!-- Symbol: | | -->
    <line x1="0" y1="0" x2="15" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <line x1="15" y1="-18" x2="15" y2="18" stroke="#00D1B2" stroke-width="2.5"/>
    <line x1="27" y1="-18" x2="27" y2="18" stroke="#00D1B2" stroke-width="2.5"/>
    <line x1="27" y1="0" x2="42" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <!-- Tags -->
    <text x="21" y="-24" fill="#00D1B2" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">"Start_PB"</text>
    <text x="21" y="32" fill="#A7B0BE" font-family="monospace" font-size="10" text-anchor="middle">%I0.0</text>
  </g>

  <!-- Branch below Start_PB: Latch Contact Q0.0 -->
  <line x1="120" y1="150" x2="120" y2="230" stroke="#00D1B2" stroke-width="2"/>
  <line x1="120" y1="230" x2="160" y2="230" stroke="#00D1B2" stroke-width="2"/>
  
  <g transform="translate(160, 230)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <line x1="15" y1="-18" x2="15" y2="18" stroke="#00D1B2" stroke-width="2.5"/>
    <line x1="27" y1="-18" x2="27" y2="18" stroke="#00D1B2" stroke-width="2.5"/>
    <line x1="27" y1="0" x2="42" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <!-- Tags -->
    <text x="21" y="-24" fill="#4DA3FF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">"Motor_Contactor"</text>
    <text x="21" y="32" fill="#A7B0BE" font-family="monospace" font-size="10" text-anchor="middle">%Q0.0 (Latch)</text>
  </g>

  <line x1="202" y1="230" x2="242" y2="230" stroke="#00D1B2" stroke-width="2"/>
  <line x1="242" y1="230" x2="242" y2="150" stroke="#00D1B2" stroke-width="2"/>

  <!-- Wire to Stop Contact -->
  <line x1="202" y1="150" x2="310" y2="150" stroke="#00D1B2" stroke-width="2"/>

  <!-- Contact 2: Stop Pushbutton (Normally Closed - | / | -) -->
  <g transform="translate(310, 150)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <line x1="15" y1="-18" x2="15" y2="18" stroke="#00D1B2" stroke-width="2.5"/>
    <line x1="27" y1="-18" x2="27" y2="18" stroke="#00D1B2" stroke-width="2.5"/>
    <!-- Slash for NC -->
    <line x1="11" y1="16" x2="31" y2="-16" stroke="#FF7B72" stroke-width="2"/>
    <line x1="27" y1="0" x2="42" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <!-- Tags -->
    <text x="21" y="-24" fill="#FF7B72" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">"Stop_PB"</text>
    <text x="21" y="32" fill="#A7B0BE" font-family="monospace" font-size="10" text-anchor="middle">%I0.1 (NC)</text>
  </g>

  <!-- Wire to Overload Contact -->
  <line x1="352" y1="150" x2="460" y2="150" stroke="#00D1B2" stroke-width="2"/>

  <!-- Contact 3: Thermal Overload Relay (NC) -->
  <g transform="translate(460, 150)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <line x1="15" y1="-18" x2="15" y2="18" stroke="#00D1B2" stroke-width="2.5"/>
    <line x1="27" y1="-18" x2="27" y2="18" stroke="#00D1B2" stroke-width="2.5"/>
    <!-- Slash for NC -->
    <line x1="11" y1="16" x2="31" y2="-16" stroke="#FF7B72" stroke-width="2"/>
    <line x1="27" y1="0" x2="42" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <!-- Tags -->
    <text x="21" y="-24" fill="#FFD166" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">"Overload_Trip"</text>
    <text x="21" y="32" fill="#A7B0BE" font-family="monospace" font-size="10" text-anchor="middle">%I0.2 (NC)</text>
  </g>

  <!-- Wire to Output Coil -->
  <line x1="502" y1="150" x2="650" y2="150" stroke="#00D1B2" stroke-width="2"/>

  <!-- Output Coil: -( )- -->
  <g transform="translate(650, 150)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <path d="M 15 -18 A 18 18 0 0 1 15 18" fill="none" stroke="#00D1B2" stroke-width="2.5"/>
    <path d="M 35 -18 A 18 18 0 0 0 35 18" fill="none" stroke="#00D1B2" stroke-width="2.5"/>
    <line x1="35" y1="0" x2="50" y2="0" stroke="#00D1B2" stroke-width="2"/>
    <!-- Coil Tag -->
    <text x="25" y="-24" fill="#00D1B2" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">"Motor_Coil"</text>
    <text x="25" y="32" fill="#A7B0BE" font-family="monospace" font-size="10" text-anchor="middle">%Q0.0</text>
  </g>

  <!-- Complete wire to Right Rail -->
  <line x1="700" y1="150" x2="800" y2="150" stroke="#00D1B2" stroke-width="2"/>

  <!-- Annotation Note -->
  <g transform="translate(80, 290)">
    <text x="0" y="0" fill="#7D8590" font-family="monospace" font-size="11">LOGIC EQUATION: %Q0.0 = (%I0.0 OR %Q0.0) AND %I0.1 AND %I0.2</text>
    <text x="0" y="18" fill="#7D8590" font-family="system-ui, sans-serif" font-size="10">SIEMENS S7-1200 / S7-1500 PLC AUTOMATION RUNTIME STANDARD</text>
  </g>
</svg>
