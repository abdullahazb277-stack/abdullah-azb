<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D1B2"/>
      <stop offset="100%" stop-color="#4DA3FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B0F14" stroke="#283443" stroke-width="2"/>
  <!-- Circuit grid background subtle lines -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="#151E29" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="8" y1="44" x2="56" y2="44" stroke="#151E29" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="20" y1="8" x2="20" y2="56" stroke="#151E29" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="44" y1="8" x2="44" y2="56" stroke="#151E29" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Tech Monogram AA + Circuit Path -->
  <path d="M16 48 L25 16 L34 48 M19 38 L31 38" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 48 L39 16 L48 48 M33 38 L45 38" fill="none" stroke="#00D1B2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Circuit Nodes -->
  <circle cx="25" cy="16" r="2.5" fill="#4DA3FF" />
  <circle cx="39" cy="16" r="2.5" fill="#00D1B2" />
  <circle cx="16" cy="48" r="2" fill="#00D1B2" />
  <circle cx="48" cy="48" r="2" fill="#4DA3FF" />
</svg>
